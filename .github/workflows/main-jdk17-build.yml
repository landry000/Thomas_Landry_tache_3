name: main jdk17 build

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # historique complet pour retrouver le commit de base

      - name: Autoriser git dans le conteneur
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Déterminer le commit de base
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE="$(git rev-parse HEAD~1)"
            fi
          fi
          echo "Commit de base : $BASE"
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"

      - name: Scan Semgrep (nouveaux résultats seulement)
        run: |
          semgrep scan \
            --metrics=off \
            --config p/java --config p/security-audit \
            --config p/owasp-top-ten --config p/command-injection \
            --include='*.java' \
            --baseline-commit "${{ steps.base.outputs.sha }}" \
            --sarif --output semgrep.sarif \
            --error

      - name: Publier le rapport SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        java: [ '17' ]

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: Install external tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libimage-exiftool-perl
      - name: Build with Maven
        run: mvn clean apache-rat:check test install javadoc:aggregate -Pci -B -pl '!:tika-parser-code-module' "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
      - name: Détecter un test en échec
        id: tests
        if: failure()
        run: |
          echo "Rapports Surefire trouvés :"
          find . -name "TEST-*.xml" -path "*surefire-reports*" | head -20
          grep -rlE "<(failure|error)" --include="TEST-*.xml" . > /tmp/failed.txt 2>/dev/null || true
          echo "Rapports avec échec :"
          cat /tmp/failed.txt
          if [ -s /tmp/failed.txt ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            echo "name=$(head -1 /tmp/failed.txt | xargs basename | sed 's/^TEST-//; s/\.xml$//')" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Valeurs écrites :"
          cat "$GITHUB_OUTPUT"

      - name: Rickroll
        if: failure() && steps.tests.outputs.failed == 'true'
        uses: ./.github/actions/rickroll
        with:
          test-name: ${{ steps.tests.outputs.name }}
      - name: Publier les rapports de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            **/target/surefire-reports/
            **/target/rat.txt
          if-no-files-found: ignore
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    strategy:
      matrix:
        java: [ '17' ]

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: Run E2E Tests
        run: mvn -pl tika-e2e-tests -am clean verify -Pe2e -B "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
